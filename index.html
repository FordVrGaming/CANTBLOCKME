<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opening…</title>
  <script>
    (function () {
      var url = "https://shorturl.at/GBsLv";

      // Try to open the destination in a new tab immediately
      var win = window.open(url, "_blank");

      if (win) {
        // Prevent the new tab from controlling this page
        win.opener = null;
      } else {
        // Popup was blocked — fall back to opening in the same tab
        window.location.href = url;
      }
    })();
  </script>
</head>
<body></body>
</html>
