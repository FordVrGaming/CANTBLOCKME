<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unblocked Arcade</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
body{background:#0b0f17;color:#eef2ff;line-height:1.5;padding:1rem;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrapper{max-width:1300px;width:100%}
.hero{background:linear-gradient(145deg,#141b2b,#0e121f);border-radius:2rem;padding:2rem 2rem 1.5rem;margin-bottom:2rem;box-shadow:0 20px 35px -10px rgba(0,0,0,.7);border:1px solid #2a3446}
.hero h1{font-size:2.4rem;font-weight:700;display:flex;align-items:center;gap:.75rem;letter-spacing:-.5px}
.hero h1 i{color:#5f9ea0;background:#1e2a3a;padding:.5rem;border-radius:1.2rem;font-size:1.8rem}
.hero p{color:#9aa9c0;margin-top:.4rem;font-size:1.1rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.hero p i{color:#7f9fbf}
.badge{background:#1d2a3c;padding:.2rem 1rem;border-radius:2rem;font-size:.85rem;color:#b0c8e0;border:1px solid #33455e}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.8rem}
.search-box{display:flex;align-items:center;background:#111a26;border-radius:3rem;padding:.4rem .4rem .4rem 1.5rem;border:1px solid #2e4057;flex:1 1 280px;transition:all .2s}
.search-box:focus-within{border-color:#4f7aa6;box-shadow:0 0 0 3px rgba(79,122,166,.2)}
.search-box i{color:#5e7a9a;font-size:1rem}
.search-box input{background:transparent;border:none;padding:.8rem 1rem;color:#eef2ff;width:100%;outline:none;font-size:1rem}
.search-box input::placeholder{color:#4e617c}
.search-box button{background:#1e3146;border:none;border-radius:3rem;padding:.7rem 1.5rem;color:#d0e0f0;font-weight:500;cursor:pointer;transition:background .2s;font-size:.9rem;display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.search-box button:hover{background:#2c405a}
.filter-chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:#111a26;border:1px solid #2a3a4e;padding:.6rem 1.2rem;border-radius:3rem;font-size:.85rem;font-weight:500;color:#b8cde0;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.4rem}
.chip i{font-size:.8rem}
.chip.active,.chip:hover{background:#1f3248;border-color:#4f7aa6;color:#e6f0ff}
.chip.active{background:#1d3f5c;border-color:#6a9fd0;box-shadow:0 0 0 1px #4f7aa6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.3rem;margin-bottom:3rem;min-height:200px}
.game-card{background:#101a26;border-radius:1.6rem;overflow:hidden;border:1px solid #223142;transition:transform .15s,border-color .2s,box-shadow .2s;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);display:flex;flex-direction:column;cursor:pointer}
.game-card:hover{transform:translateY(-4px);border-color:#3d5a7a;box-shadow:0 18px 25px -10px #03060b}
.game-thumb{background:#192635;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3.2rem;color:#2f4b6b;border-bottom:1px solid #1e2c3c;transition:background .2s;position:relative}
.game-card:hover .game-thumb{background:#1e3044;color:#5382b0}
.game-thumb i{filter:drop-shadow(0 4px 6px #00000050)}
.game-info{padding:1rem 1rem 1.2rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.game-info h3{font-weight:600;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfeaf9}
.game-meta{display:flex;align-items:center;justify-content:space-between;margin-top:.2rem}
.tag{background:#1b2c40;padding:.2rem .8rem;border-radius:2rem;font-size:.7rem;font-weight:500;letter-spacing:.3px;color:#a1bbd4;text-transform:uppercase;border:1px solid #2d4058}
.play-icon{font-size:.9rem;color:#6f95bb;transition:color .2s}
.game-card:hover .play-icon{color:#9bc0e6}
.no-results{grid-column:1/-1;text-align:center;padding:3rem 1rem;background:#0e1622;border-radius:2rem;border:1px dashed #2a3a4e;color:#8b9fb5;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.no-results i{font-size:2.5rem;color:#2c405a}
.player-modal{position:fixed;inset:0;background:rgba(5,8,14,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s ease}
.player-modal.active{opacity:1;pointer-events:auto}
.player-container{width:100%;max-width:1200px;height:90vh;max-height:850px;background:#0d1520;border-radius:1.5rem;border:1px solid #2a3a4e;box-shadow:0 30px 60px -15px #000000cc;display:flex;flex-direction:column;overflow:hidden;transform:scale(.96);transition:transform .25s ease}
.player-modal.active .player-container{transform:scale(1)}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;background:#101b29;border-bottom:1px solid #1e2c3c;flex-shrink:0}
.player-title{display:flex;align-items:center;gap:.7rem;min-width:0}
.player-title i{color:#5f9ea0;font-size:1.2rem;flex-shrink:0}
.player-title h2{font-size:1.15rem;font-weight:600;color:#e2ecf9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-actions{display:flex;gap:.5rem;flex-shrink:0}
.player-btn{background:#1a2a3c;border:1px solid #2d4058;color:#b4cbe0;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .15s}
.player-btn:hover{background:#263c54;color:#e6f0ff;border-color:#4f7aa6}
.player-btn.close-btn:hover{background:#5c2a2a;border-color:#a64f4f;color:#ffd6d6}
.player-frame-wrapper{flex:1;background:#000;position:relative;overflow:hidden}
#gameIframe{width:100%;height:100%;border:none;display:block;background:#000}

/* === YOUTUBE UI === */
.yt-ui{display:none;flex-direction:column;width:100%;height:100%;background:#0f0f0f;color:#fff;overflow:hidden}
.yt-ui.active{display:flex}
.yt-bar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;background:#0f0f0f;border-bottom:1px solid #272727;flex-shrink:0}
.yt-logo{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:1.1rem;color:#fff;flex-shrink:0}
.yt-logo i{color:#ff0000;font-size:1.4rem}
.yt-search{display:flex;align-items:center;flex:1;background:#121212;border:1px solid #303030;border-radius:2rem;padding:.3rem .3rem .3rem 1rem;max-width:640px}
.yt-search input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:.6rem .8rem;font-size:.95rem}
.yt-search input::placeholder{color:#888}
.yt-search button{background:#222;border:none;color:#fff;padding:.6rem 1.2rem;border-radius:2rem;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.3rem}
.yt-search button:hover{background:#303030}
.yt-body{flex:1;display:flex;overflow:hidden}
.yt-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.yt-player{background:#000;aspect-ratio:16/9;width:100%}
.yt-player iframe{width:100%;height:100%;border:none;display:block}
.yt-results{flex:1;overflow-y:auto;padding:.8rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;align-content:start}
.yt-results::-webkit-scrollbar{width:8px}
.yt-results::-webkit-scrollbar-thumb{background:#303030;border-radius:4px}
.yt-item{cursor:pointer;display:flex;flex-direction:column;gap:.4rem;background:#181818;border-radius:.8rem;overflow:hidden;transition:background .15s}
.yt-item:hover{background:#272727}
.yt-item img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.yt-item .yt-meta{padding:.5rem .6rem .7rem;display:flex;flex-direction:column;gap:.2rem}
.yt-item .yt-meta h4{font-size:.85rem;font-weight:600;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yt-item .yt-meta span{font-size:.72rem;color:#aaa}
.yt-empty{grid-column:1/-1;text-align:center;color:#888;padding:2rem 1rem;font-size:.9rem}
.yt-loading{grid-column:1/-1;text-align:center;color:#888;padding:2rem 1rem;font-size:.9rem}

.player-footer{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.2rem;background:#101b29;border-top:1px solid #1e2c3c;font-size:.8rem;color:#7b8fa6;flex-shrink:0;gap:1rem;flex-wrap:wrap}
.player-footer i{color:#4f7aa6;margin-right:.3rem}
#playerCategory{text-transform:uppercase;letter-spacing:.5px;font-weight:600;color:#8fb0d0}
.footer{text-align:center;padding:1.5rem 0 .8rem;color:#4f617a;border-top:1px solid #1c2533;font-size:.85rem;margin-top:1rem;display:flex;justify-content:center;align-items:center;gap:1.2rem;flex-wrap:wrap}
.footer i{color:#3f5a78;margin-right:.3rem}
@media (max-width:700px){.player-container{height:95vh;border-radius:1rem}.player-header{padding:.7rem .9rem}.player-title h2{font-size:1rem}.player-btn{width:34px;height:34px;font-size:.85rem}.player-footer{font-size:.7rem;padding:.5rem .9rem}.player-footer span:last-child{display:none}.yt-bar{flex-wrap:wrap}.yt-search{max-width:none}}
@media (max-width:550px){.hero h1{font-size:1.8rem}.hero{padding:1.5rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}.search-box{padding-left:1rem}.search-box button span{display:none}.search-box button{padding:.7rem 1rem}.yt-results{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrapper">
<header class="hero">
<h1><i class="fas fa-gamepad"></i> Unblocked Arcade</h1>
<p><i class="fas fa-infinity"></i> Play anytime, anywhere <span class="badge"><i class="fas fa-bolt"></i> <span id="gameCount">0</span> sites</span></p>
</header>

<div class="toolbar">
<div class="search-box">
<i class="fas fa-search"></i>
<input type="text" id="searchInput" placeholder="Search sites or type any URL (youtube.com, twitch.tv...)" autocomplete="off">
<button id="clearSearchBtn"><i class="fas fa-times"></i> <span>Clear</span></button>
</div>
<div class="filter-chips" id="filterChips">
<div class="chip active" data-category="all"><i class="fas fa-layer-group"></i> All</div>
<div class="chip" data-category="social"><i class="fas fa-users"></i> Social</div>
<div class="chip" data-category="streaming"><i class="fas fa-play"></i> Streaming</div>
<div class="chip" data-category="games"><i class="fas fa-gamepad"></i> Games</div>
<div class="chip" data-category="tools"><i class="fas fa-wrench"></i> Tools</div>
</div>
</div>

<div class="grid" id="gameGrid"></div>

<footer class="footer">
<span><i class="fas fa-shield-alt"></i> No downloads</span>
<span><i class="fas fa-unlock-alt"></i> Unblocked</span>
</footer>
</div>

<div class="player-modal" id="playerModal">
<div class="player-container">
<div class="player-header">
<div class="player-title">
<i class="fas fa-globe"></i>
<h2 id="playerGameTitle">Site Title</h2>
</div>
<div class="player-actions">
<button class="player-btn" id="openExternalBtn" title="Open in new tab"><i class="fas fa-external-link-alt"></i></button>
<button class="player-btn" id="reloadGameBtn" title="Reload"><i class="fas fa-sync-alt"></i></button>
<button class="player-btn" id="fullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
<button class="player-btn close-btn" id="closePlayerBtn" title="Close"><i class="fas fa-times"></i></button>
</div>
</div>
<div class="player-frame-wrapper">

<!-- YOUTUBE UI -->
<div class="yt-ui" id="ytUI">
<div class="yt-bar">
<div class="yt-logo"><i class="fa-brands fa-youtube"></i> YouTube</div>
<div class="yt-search">
<input type="text" id="ytSearchInput" placeholder="Search YouTube...">
<button id="ytSearchBtn"><i class="fas fa-search"></i></button>
</div>
</div>
<div class="yt-body">
<div class="yt-main">
<div class="yt-player">
<iframe id="ytPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
<div class="yt-results" id="ytResults">
<div class="yt-empty">Type a query above to search YouTube.</div>
</div>
</div>
</div>
</div>

<!-- GENERIC IFRAME -->
<iframe id="gameIframe" src="about:blank" frameborder="0" allowfullscreen allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; encrypted-media; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-orientation-lock allow-presentation allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-downloads"></iframe>
</div>
<div class="player-footer">
<span id="playerCategory"><i class="fas fa-tag"></i> category</span>
<span><i class="fas fa-info-circle"></i> If site blocks embedding, use the external-link button</span>
</div>
</div>
</div>

<script>
(function(){
/* ============================================================

var YT_API_KEY = "AIzaSyCHKIjtv0LjNaaUT2euBuxwr7GE1D85IKU";

var games=[
/* STREAMING / VIDEO */
{id:"youtube",title:"YouTube",category:"streaming",icon:"fa-brands fa-youtube",tags:["video","youtube","music","streaming","watch"],url:"youtube-internal",youtube:true},

{id:"googledrive",title:"Google Drive",category:"tools",icon:"fa-brands fa-google-drive",tags:["cloud","drive","google"],url:"https://drive.google.com/",external:true},

{id:"2048",title:"2048",category:"games",icon:"fa-solid fa-table-cells",tags:["puzzle","numbers"],url:"https://play2048.co/"},

{id:"tunnelrush",title:"Tunnel Rush",category:"games",icon:"fa-solid fa-bolt",tags:["action","fast"],url:"https://tunnelrush.io/"},
{id:"doodlejump",title:"Doodle Jump",category:"games",icon:"fa-solid fa-arrow-up",tags:["arcade","jump"],url:"https://doodlejump.io/"},
{id:"minesweeper",title:"Minesweeper",category:"games",icon:"fa-solid fa-bomb",tags:["puzzle","classic"],url:"https://minesweeper.online/"},

{id:"soccerrandom",title:"Soccer Random",category:"games",icon:"fa-solid fa-futbol",tags:["sports","funny"],url:"https://soccer-random.io/"},
{id:"flappybird",title:"Flappy Bird",category:"games",icon:"fa-solid fa-dove",tags:["arcade","bird"],url:"https://flappybird.io/"}
];

var currentCategory="all",searchQuery="",activeGame=null;
var grid=document.getElementById('gameGrid');
var searchInput=document.getElementById('searchInput');
var clearBtn=document.getElementById('clearSearchBtn');
var filterChips=document.getElementById('filterChips');
var gameCountSpan=document.getElementById('gameCount');
var playerModal=document.getElementById('playerModal');
var playerGameTitle=document.getElementById('playerGameTitle');
var playerCategory=document.getElementById('playerCategory');
var gameIframe=document.getElementById('gameIframe');
var closePlayerBtn=document.getElementById('closePlayerBtn');
var reloadGameBtn=document.getElementById('reloadGameBtn');
var fullscreenBtn=document.getElementById('fullscreenBtn');
var openExternalBtn=document.getElementById('openExternalBtn');

var ytUI=document.getElementById('ytUI');
var ytSearchInput=document.getElementById('ytSearchInput');
var ytSearchBtn=document.getElementById('ytSearchBtn');
var ytResults=document.getElementById('ytResults');
var ytPlayer=document.getElementById('ytPlayer');

gameCountSpan.textContent=games.length;

function isURL(str){
var pattern=/^(https?:\/\/)?([\w\-]+\.)+[a-z]{2,}(\/[\w\-./?%&=+#]*)?$/i;
return pattern.test(str.trim());
}

function normalizeURL(str){
str=str.trim();
if(!/^https?:\/\//i.test(str)){str='https://'+str;}
return str;
}

function openGame(g){
activeGame=g;
playerGameTitle.textContent=g.title;
playerCategory.innerHTML='<i class="fas fa-tag"></i> '+g.category;
if(g.youtube){
gameIframe.style.display='none';
ytUI.classList.add('active');
playerModal.classList.add('active');
document.body.style.overflow='hidden';
ytPlayer.src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0';
return;
}
ytUI.classList.remove('active');
gameIframe.style.display='block';
if(g.external){
window.open(g.url,'_blank','noopener,noreferrer');
return;
}
gameIframe.src=g.url;
playerModal.classList.add('active');
document.body.style.overflow='hidden';
}

function openURL(url,title){
activeGame={id:'custom',title:title||'Custom Site',category:'custom',url:url,external:true};
playerGameTitle.textContent=activeGame.title;
playerCategory.innerHTML='<i class="fas fa-tag"></i> custom';
window.open(url,'_blank','noopener,noreferrer');
}

function renderGames(){
var filtered=games.filter(function(g){
var mCat=currentCategory==='all'||g.category===currentCategory;
var q=searchQuery.toLowerCase();
var mSearch=searchQuery===''||g.title.toLowerCase().indexOf(q)!==-1||(g.tags&&g.tags.some(function(t){return t.toLowerCase().indexOf(q)!==-1}));
return mCat&&mSearch;
});
if(filtered.length===0){
var directHTML='';
if(searchQuery.trim()!==''&&isURL(searchQuery)){
directHTML='<div class="no-results" style="border-color:#4f7aa6;background:#0f1d2e"><i class="fas fa-globe" style="color:#5f9ea0"></i><span>No matching site. Open as website?</span><button id="openDirectBtn" style="background:#1d3f5c;border:1px solid #6a9fd0;color:#e6f0ff;padding:.7rem 1.8rem;border-radius:3rem;cursor:pointer;font-size:.95rem;margin-top:.5rem"><i class="fas fa-external-link-alt"></i> Open '+searchQuery.trim()+'</button></div>';
}else{
directHTML='<div class="no-results"><i class="fas fa-search-minus"></i><span>No sites found. Paste any URL (youtube.com, twitch.tv, etc.) to auto-unblock.</span></div>';
}
grid.innerHTML=directHTML;
var btn=document.getElementById('openDirectBtn');
if(btn){btn.addEventListener('click',function(){openURL(normalizeURL(searchQuery),searchQuery.trim());});}
return;
}
var html='';
filtered.forEach(function(g){
html+='<div class="game-card" data-id="'+g.id+'"><div class="game-thumb"><i class="'+g.icon+'"></i></div><div class="game-info"><h3>'+g.title+'</h3><div class="game-meta"><span class="tag">'+g.category+'</span><i class="fas fa-play-circle play-icon"></i></div></div></div>';
});
grid.innerHTML=html;
document.querySelectorAll('.game-card').forEach(function(c){
c.addEventListener('click',function(){
var id=c.getAttribute('data-id');
var g=games.find(function(x){return x.id===id});
if(g)openGame(g);
});
});
}

function closePlayer(){
playerModal.classList.remove('active');
document.body.style.overflow='';
setTimeout(function(){
if(!playerModal.classList.contains('active')){
gameIframe.src='about:blank';
ytPlayer.src='about:blank';
ytUI.classList.remove('active');
gameIframe.style.display='block';
activeGame=null;
}
},300);
}

function reloadGame(){
if(!activeGame)return;
if(activeGame.youtube){
ytPlayer.src='about:blank';
setTimeout(function(){ytPlayer.src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0';},50);
return;
}
gameIframe.src='about:blank';
setTimeout(function(){gameIframe.src=activeGame.url;},50);
}

function toggleFullscreen(){
var w=document.querySelector('.player-frame-wrapper');
if(!document.fullscreenElement){w.requestFullscreen().catch(function(e){console.log(e)})}else{document.exitFullscreen()}
}

function openExternal(){
if(!activeGame)return;
if(activeGame.youtube){window.open('https://www.youtube.com/','_blank','noopener,noreferrer');return;}
window.open(activeGame.url,'_blank','noopener,noreferrer');
}

/* === YOUTUBE SEARCH === */
function ytSearch(){
var q=ytSearchInput.value.trim();
if(q==='')return;
ytResults.innerHTML='<div class="yt-loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=18&q='+encodeURIComponent(q)+'&key='+YT_API_KEY;
fetch(url).then(function(r){return r.json()}).then(function(data){
if(data.error){
ytResults.innerHTML='<div class="yt-empty">API error: '+data.error.message+'</div>';
return;
}
if(!data.items||data.items.length===0){
ytResults.innerHTML='<div class="yt-empty">No results for "'+q+'".</div>';
return;
}
var html='';
data.items.forEach(function(item){
var vid=item.id.videoId;
if(!vid)return;
var title=item.snippet.title;
var thumb=item.snippet.thumbnails.medium.url;
var channel=item.snippet.channelTitle;
var published=new Date(item.snippet.publishedAt).toLocaleDateString();
html+='<div class="yt-item" data-vid="'+vid+'"><img src="'+thumb+'" alt=""><div class="yt-meta"><h4>'+title+'</h4><span>'+channel+' • '+published+'</span></div></div>';
});
ytResults.innerHTML=html;
document.querySelectorAll('.yt-item').forEach(function(el){
el.addEventListener('click',function(){
var vid=el.getAttribute('data-vid');
ytPlayer.src='https://www.youtube.com/embed/'+vid+'?autoplay=1&rel=0';
});
});
}).catch(function(err){
ytResults.innerHTML='<div class="yt-empty">Search error: '+err.message+'</div>';
});
}

ytSearchBtn.addEventListener('click',ytSearch);
ytSearchInput.addEventListener('keydown',function(e){if(e.key==='Enter'){ytSearch();}});

filterChips.addEventListener('click',function(e){
var chip=e.target.closest('.chip');if(!chip)return;
document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});
chip.classList.add('active');
currentCategory=chip.getAttribute('data-category');
renderGames();
});

searchInput.addEventListener('input',function(e){searchQuery=e.target.value.trim();renderGames();});

searchInput.addEventListener('keydown',function(e){
if(e.key==='Enter'&&searchQuery.trim()!==''){
if(isURL(searchQuery)){
openURL(normalizeURL(searchQuery),searchQuery.trim());
}else{
renderGames();
}
}
});

clearBtn.addEventListener('click',function(){searchInput.value='';searchQuery='';renderGames();searchInput.focus();});
closePlayerBtn.addEventListener('click',closePlayer);
reloadGameBtn.addEventListener('click',reloadGame);
fullscreenBtn.addEventListener('click',toggleFullscreen);
openExternalBtn.addEventListener('click',openExternal);
playerModal.addEventListener('click',function(e){if(e.target===playerModal)closePlayer();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&playerModal.classList.contains('active'))closePlayer();});
renderGames();
})();
</script>
</body>
